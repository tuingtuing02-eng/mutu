<style>
:root{--bg:#fff;--c:#fff;--t:#1c2430;--m:#66707f;--b:#dfe3e8;--ac:#1f5fbf;--g:#1e8e5a;--y:#d98a00;--r:#c8372d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.lg{display:block;width:100%;max-width:240px;height:auto;margin:0 0 10px}.w{max-width:1200px;margin:0 auto;padding:16px}h1{font-size:22px;margin:0}.sub{color:var(--m);margin:2px 0 14px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px}
.kp{cursor:pointer}.kp b{display:block;font-size:26px}.kp span{color:var(--m);font-size:12px}
.f{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.f input,.f select,.f button{padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit}.f input{flex:1;min-width:180px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px;margin-bottom:12px}.g h3{margin:0 0 8px;font-size:13px;color:var(--m);font-weight:600}
.cv{position:relative;height:220px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:1300px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}
th{cursor:pointer;color:var(--m);font-size:12px;user-select:none}tr.r{cursor:pointer}tr.r:hover{background:#f3f5f8}
.p{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}.AKTIF{background:#1e8e5a22;color:var(--g)}.SEGERA{background:#d98a0022;color:var(--y)}.KADALUARSA{background:#c8372d22;color:var(--r)}
.dt{background:#f7f8fa}.dt td{white-space:normal}.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.dg small{color:var(--m);display:block}
.al{border-left:4px solid var(--y);margin-bottom:12px}.al.x{border-color:var(--r)}.al li{margin:2px 0}
</style></head><body><div class="w">

const flt=()=>D.filter(r=>(!F.j||r.j==F.j)&&(!F.n||r.n==F.n)&&(!F.s||r.s==F.s)&&(!F.i||(F.i=='Ya')==r.i.startsWith('Ya'))&&(!F.c||r.c==F.c)&&(!F.q||(r.p+r.sk).toLowerCase().includes(F.q)));
function chart(id,cfg){ch[id]?(ch[id].data=cfg.data,ch[id].update()):ch[id]=new Chart(document.getElementById(id),{...cfg,options:{responsive:true,maintainAspectRatio:false,...cfg.options}})}
function render(){const R=flt(),c=s=>R.filter(r=>r.s==s).length,tot=R.length||1;
sub.textContent='Data per '+T.toLocaleDateString('id-ID',{dateStyle:'long'})+' · '+R.length+' dari '+D.length+' prodi';
const kp=[['Total Prodi',R.length,'','#'],['Unggul/A',R.filter(r=>r.n=='Unggul/A').length,Math.round(R.filter(r=>r.n=='Unggul/A').length/tot*100)+'%',''],['Aktif',c('AKTIF'),'AKTIF',''],['Segera Berakhir',c('SEGERA'),'SEGERA',''],['Kadaluarsa',c('KADALUARSA'),'KADALUARSA',''],['Int\'l (ASIIN)',R.filter(r=>r.i.startsWith('Ya')).length,'','']];
kpi.innerHTML=kp.map(k=>`<div class="card kp" data-s="${SL[k[2]]?k[2]:''}"><span>${k[0]}</span><b>${k[1]}</b><span>${k[2]&&!SL[k[2]]?k[2]+' dari total':''}</span></div>`).join('');
kpi.onclick=e=>{const s=e.target.closest('.kp')?.dataset.s;if(s!==undefined){F.s=s;fs.value=s;render()}};
const w=R.filter(r=>r.s!='AKTIF').sort((a,b)=>a.dy-b.dy);al.className='card al'+(R.some(r=>r.s=='KADALUARSA')?' x':'');
al.innerHTML=w.length?`<b>Perlu perhatian (${w.length})</b><ul style="margin:6px 0 0;padding-left:18px">`+w.map(r=>`<li>${r.p} — ${r.s=='KADALUARSA'?'<b style="color:var(--r)">kadaluarsa</b>':'berakhir'} ${fm(r.e)} (${rem(r.e)})</li>`).join('')+'</ul>':'<b>Tidak ada prodi yang kadaluarsa atau segera berakhir pada filter ini.</b>';
chart('c1',{type:'doughnut',data:{labels:NL,datasets:[{data:NL.map(n=>R.filter(r=>r.n==n).length),backgroundColor:NC,borderWidth:0}]},options:{plugins:{legend:{position:'bottom'}},onClick:(e,a)=>{if(a[0]){F.n=NL[a[0].index];fn.value=F.n;render()}}}});
const J=u('j');chart('c2',{type:'bar',data:{labels:J,datasets:NL.map((n,i)=>({label:n,data:J.map(j=>R.filter(r=>r.j==j&&r.n==n).length),backgroundColor:NC[i]}))},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{precision:0}}},plugins:{legend:{display:false}}}});
const Y={};R.forEach(r=>{if(r.e){const y=r.e.slice(0,4);Y[y]=(Y[y]||0)+1}});const ys=Object.keys(Y).sort();chart('c3',{type:'bar',data:{labels:ys,datasets:[{data:ys.map(y=>Y[y]),backgroundColor:ys.map(y=>y<T.getFullYear()?'#c8372d':y==T.getFullYear()?'#d98a00':'#1f5fbf')}]},options:{plugins:{legend:{display:false}},scales:{y:{ticks:{precision:0}}}}});
const CT=u('c'),CC={};R.forEach(r=>CC[r.c]=(CC[r.c]||0)+1);chart('c4',{type:'bar',data:{labels:CT,datasets:[{data:CT.map(x=>CC[x]||0),backgroundColor:CT.map(x=>x=='Kadaluarsa'?'#c8372d':'#1f5fbf')}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{precision:0}}}}});
const k=sort.k,v=r=>k=='dy'?r.dy:(r[k]||'');R.sort((a,b)=>(v(a)>v(b)?1:v(a)<v(b)?-1:0)*sort.d);
tb.innerHTML=R.map(r=>{const i=D.indexOf(r);return `<tr class="r" data-i="${i}"><td>${r.no}</td><td>${r.p}</td><td>${r.j}</td><td>${r.l}</td><td>${r.n}</td><td><span class="p ${r.s}">${SL[r.s].split(' (')[0]}</span></td><td>${fm(r.mu)}</td><td>${fm(r.e)}</td><td>${rem(r.e)}</td><td>${r.sw||'–'}</td><td>${fm(r.mo)}</td><td>${r.i}</td><td>${r.c||'–'}</td></tr>`+(open==i?`<tr class="dt"><td colspan="13"><div class="dg"><div><small>Nomor SK</small>${r.sk||'–'}</div><div><small>Masa berlaku SK</small>${fm(r.mu)} – ${fm(r.e)}</div><div><small>MONEV pasca akreditasi</small>${fm(r.mo)}</div><div><small>Status di file Excel</small>${r.sf||'–'}</div><div><small>Akreditasi internasional</small>${r.i}${r.i1?' · '+fm(r.i1)+' – '+fm(r.i2):''}</div><div><small>Riwayat periode</small>${r.h.map((x,j)=>`P${j+1}: ${x[0]} (s.d. ${fm(x[1])})`).join('<br>')||'–'}</div></div></td></tr>`:'')}).join('')||'<tr><td colspan="13">Tidak ada data.</td></tr>';
cnt.textContent='Klik baris untuk detail · klik judul kolom untuk mengurutkan';}
tb.onclick=e=>{const t=e.target.closest('tr.r');if(t){const i=+t.dataset.i;open=open==i?null:i;render()}};
render();
</script></body></html>
